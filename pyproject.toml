[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rayacash"
dynamic = ["version"]
description = "SDK oficial de Python para la API de Raya Cash: pagos por transferencia, transferencias, balance y webhooks."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Raya Cash", email = "soporte@raya.cash" }]
keywords = ["raya", "raya cash", "pagos", "transferencias", "cvu", "cbu", "argentina", "api", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Natural Language :: Spanish",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Office/Business :: Financial",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.26,<1",
  "typing_extensions>=4.7",
]

[project.urls]
Homepage = "https://raya.cash"
Documentation = "https://raya.cash/api"
Source = "https://github.com/rayacash/rayacash-python"
Issues = "https://github.com/rayacash/rayacash-python/issues"
Changelog = "https://github.com/rayacash/rayacash-python/blob/master/CHANGELOG.md"

[dependency-groups]
dev = [
  "anyio>=4",
  "mypy>=1.11",
  "pyright>=1.1.380",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[tool.hatch.version]
path = "src/rayacash/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rayacash"]
# 2.4 (PEP 639, license = "MIT"): la que acepta PyPI desde 2024.
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = [
  "/src/rayacash",
  "/tests",
  "/examples",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "A", "C4", "PIE", "PT", "RET", "SIM", "RUF", "TID"]
# Textos en castellano (comillas «», …) y nombres de la API (id, type, object, list).
ignore = ["RUF001", "RUF002", "RUF003", "A003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B018"]
"examples/**" = ["T201"]

[tool.mypy]
strict = true
files = ["src", "tests", "examples/conciliar_depositos.py", "examples/enviar_transferencia.py", "examples/cobrar_con_un_pago.py", "examples/reembolsar_un_pago.py", "scripts"]

[tool.pyright]
include = ["src", "tests/typecheck"]
pythonVersion = "3.9"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["rayacash"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95
exclude_also = [
  "if TYPE_CHECKING:",
  "@overload",
  "raise NotImplementedError",
  "\\.\\.\\.$",
]
